# CaP-X eval on robolab LH common-sense tasks (osmo).
#
# Each pod runs N scenes × M trials sequentially on one GPU. Pre-warmed
# HF cache + persistent SAM3/CGN/PyRoKi servers are shared across all
# scenes in the pod. Pass `scenes` as a comma-separated list and
# `batch_name` for the workflow name.
#
# Submit one of the predefined LH common-sense batches. Scene lists
# live in entry.sh's case statement (osmo's CLI eats both ',' and ':'
# from --set-string values, so passing a scene list as a parameter
# doesn't work — the case stmt is keyed off batch_name instead).
#
#   osmo workflow submit osmo/run-capx-skill-library.yaml \
#       --pool isaac-srl-l40-04 \
#       --set-string batch_name=capx-cs-batch-0 \
#       --set trials=3
#
# Available batch_name values: capx-cs-batch-{0..9} (3 scenes each,
# 30 LH common-sense scenes total) and `smoke` (just InferClearTableTask).
#
# Outputs land on Lustre at:
#   /mnt/amlfs-04/home/{{user_name}}/capx-results/<scene>/<run_ts>/
# (one dir per scene; all scenes in the same pod share the run_ts).
# Sync-able from a syncer on the same osmo pool.

workflow:
  name: capx-robolab-{{batch_name}}
  tasks:
  - name: capx-trial
    image: nvcr.io/nvidia/isaac-lab:2.2.0
    command: ["bash"]
    args: ["/tmp/entry.sh"]
    environment:
      ACCEPT_EULA: Y
      NO_NUCLEUS: Y
    credentials:
      github-pat: /tmp/github
      hf-token: /tmp/hf
      nvidia-api-key: /tmp/nvidia
    files:
    - path: /tmp/setup_github_auth.sh
      contents: |-
        # Configure git to use the PAT for HTTPS clones of ChicyChen/cap-x.
        # The osmo credential mount creates a single file under /tmp/github
        # whose name is the credential's *payload key* — not the credential
        # name. Different creds were set up with different conventions
        # (github_pat / github-pat), so we just read whatever's in there.
        echo "[auth] /tmp/github contents: $(ls /tmp/github/ 2>&1)"
        GH_FILE=$(ls /tmp/github/ 2>/dev/null | head -1)
        if [ -z "$GH_FILE" ]; then
          echo "[auth] FATAL: /tmp/github is empty — credential not mounted"
          exit 1
        fi
        GH_PAT=$(cat "/tmp/github/$GH_FILE")
        git config --global credential.helper store
        echo "https://ChicyChen:${GH_PAT}@github.com" > ~/.git-credentials
        git config --global credential.helper 'store --file ~/.git-credentials'

    - path: /tmp/predownload_models.py
      contents: |-
        # Pre-warm large HF model weights into $HF_HOME (Lustre) so the
        # SAM3 server's first-run hf_hub_download is a cache hit and the
        # entry script's port-wait loop doesn't time out. SAM3 is
        # mandatory; Molmo is best-effort (V2 only).
        #
        # We disable Xet (chunked-dedup transfer) and use hf_transfer
        # (parallel Rust downloader). On a fresh cache, Xet's per-chunk
        # round-trips dominate vs single direct HTTPS GETs — first
        # measurement was ~2 MB/s with Xet, hf_transfer reaches 50+ MB/s.
        import os
        os.environ["HF_HUB_DISABLE_XET"] = "1"
        os.environ["HF_HUB_ENABLE_HF_TRANSFER"] = "1"
        from huggingface_hub import snapshot_download
        token = os.environ.get("HF_TOKEN")
        print("[predownload] facebook/sam3 (sam3.pt + config.json) ...", flush=True)
        snapshot_download(
            "facebook/sam3",
            allow_patterns=["sam3.pt", "config.json"],
            token=token,
            max_workers=8,
        )
        print("[predownload] facebook/sam3 done.", flush=True)
        try:
            print("[predownload] allenai/Molmo-7B-D-0924 (full, for V2) ...", flush=True)
            snapshot_download(
                "allenai/Molmo-7B-D-0924",
                token=token,
                max_workers=8,
            )
            print("[predownload] Molmo done.", flush=True)
        except Exception as e:
            print(f"[predownload] WARNING: Molmo pre-warm failed: {e}", flush=True)

    - path: /tmp/entry.sh
      contents: |
        set -e
        echo "batch_name : {{batch_name}}"
        echo "trials     : {{trials}}"
        echo "user_name  : {{user_name}}"
        date

        # Hide conflicting Vulkan files before Isaac Sim starts.
        if [ -e "/usr/share/vulkan" ] && [ -e "/etc/vulkan" ]; then
          mv /usr/share/vulkan /usr/share/vulkan_hidden
        fi

        apt update
        apt install -y openssh-server git tmux vim htop git-lfs iputils-ping ffmpeg
        mkdir -p /run/sshd
        # Mirror syncer yaml: enable empty-password root login so
        # `osmo workflow port-forward <wf> capx-trial --port :22` lets
        # us debug the live pod (read /tmp/capx_servers/sam3.log etc).
        sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
        sed -i 's/#PermitEmptyPasswords.*/PermitEmptyPasswords yes/' /etc/ssh/sshd_config
        echo 'PermitRootLogin yes' >> /etc/ssh/sshd_config
        echo 'PermitEmptyPasswords yes' >> /etc/ssh/sshd_config
        passwd -d root
        /sbin/sshd

        bash /tmp/setup_github_auth.sh

        export LUSTRE_USER={{user_name}}
        export LUSTRE_DIR=/mnt/amlfs-04/home/{{user_name}}
        export ROBOLAB_DIR=$LUSTRE_DIR/robolab
        export CAPX_DIR=$LUSTRE_DIR/cap-x
        export VLM_ORCH_DIR=$LUSTRE_DIR/vlm-orchestrator

        # Tokens used inside the trial. Same payload-key-vs-name caveat
        # as for github above — read whatever's in the mounted dir.
        echo "[auth] /tmp/hf: $(ls /tmp/hf/ 2>&1)  /tmp/nvidia: $(ls /tmp/nvidia/ 2>&1)"
        HF_FILE=$(ls /tmp/hf/ 2>/dev/null | head -1)
        NV_FILE=$(ls /tmp/nvidia/ 2>/dev/null | head -1)
        export HF_TOKEN=$(cat "/tmp/hf/$HF_FILE" 2>/dev/null)
        export NVIDIA_API_KEY=$(cat "/tmp/nvidia/$NV_FILE" 2>/dev/null)

        # ---------------------------------------------------------- #
        # Sync cap-x from the private GitHub repo into Lustre. Pulls
        # the latest main on every run; the Lustre clone persists
        # across pods so deps don't have to re-install fully.
        #
        # Race-safe: when many pods start simultaneously they all hit
        # the same .git/index.lock. flock on a sibling lockfile + a
        # `rm -f .git/index.lock` for stale locks (mirrors the pattern
        # in robolab's run-eval-pi05 yaml).
        # ---------------------------------------------------------- #
        (
          flock -x 200
          if [ ! -d "$CAPX_DIR/.git" ]; then
            echo "[setup] cloning ChicyChen/cap-x → $CAPX_DIR"
            git clone --recurse-submodules \
              https://github.com/ChicyChen/cap-x.git "$CAPX_DIR"
          else
            echo "[setup] updating cap-x in $CAPX_DIR"
            cd "$CAPX_DIR"
            rm -f .git/index.lock
            git fetch chicychen 2>/dev/null || git fetch origin
            git reset --hard origin/main 2>/dev/null || git reset --hard main
            git submodule update --init --recursive
          fi
        ) 200>"$LUSTRE_DIR/.lock-cap-x"

        # Robolab and vlm-orchestrator are expected to be on Lustre
        # already (per robolab's pi05 osmo recipe).
        if [ ! -d "$ROBOLAB_DIR" ]; then
          echo "[setup] FATAL: robolab not found at $ROBOLAB_DIR"
          exit 1
        fi
        if [ ! -d "$VLM_ORCH_DIR" ]; then
          echo "[setup] WARNING: vlm-orchestrator not at $VLM_ORCH_DIR — offline scorer will fail"
        fi

        # ---------------------------------------------------------- #
        # Install cap-x into Isaac Sim's Python.
        # Mirrors the local capx-robolab conda env package set.
        # ---------------------------------------------------------- #
        ISAAC_PY=/workspace/isaaclab/_isaac_sim/python.sh

        echo "[install] robolab + cap-x (--no-deps; isaaclab + isaacsim already in container)"
        cd "$ROBOLAB_DIR"
        $ISAAC_PY -m pip install --no-deps -e .
        $ISAAC_PY -m pip install json_numpy pyzmq tyro trimesh==4.5.1

        cd "$CAPX_DIR"
        $ISAAC_PY -m pip install --no-deps -e .
        $ISAAC_PY -m pip install --no-build-isolation --no-deps \
            -e capx/third_party/sam3 \
            -e capx/third_party/contact_graspnet_pytorch
        $ISAAC_PY -m pip install \
            'pyroki @ git+https://github.com/chungmin99/pyroki.git' \
            viser yourdfpy robot_descriptions open3d msgpack_numpy \
            iopath 'ftfy==6.1.1' 'timm>=1.0.17' decord pycocotools pyrender \
            'numpy==1.26.4' 'jax<0.4.30' 'jaxlib<0.4.30' 'websockets==13.1' \
            'protobuf<4.21' hf_transfer

        if [ -d "$VLM_ORCH_DIR" ]; then
          $ISAAC_PY -m pip install --no-deps -e "$VLM_ORCH_DIR"
        fi

        # ---------------------------------------------------------- #
        # Pre-warm large model weights on Lustre. Without this, the
        # SAM3 server's first-run hf_hub_download takes >10 min and
        # the port-wait loop below times out, leaving the trial to
        # spin on retry/sleep until cap-x's per-trial timeout fires.
        # Caching to $LUSTRE_DIR/hf_cache makes the download a one-time
        # cost — subsequent pods read from Lustre and bind in ~30s.
        # Molmo is fetched too so V2 (Molmo sidecar) doesn't pay the
        # download on first launch.
        # ---------------------------------------------------------- #
        export HF_HOME=$LUSTRE_DIR/hf_cache
        mkdir -p "$HF_HOME"
        echo "[predownload] HF_HOME=$HF_HOME (start size: $(du -sh $HF_HOME 2>/dev/null | cut -f1))"
        # SAM3 is required (V1); Molmo is best-effort (V2 sidecar — if
        # it fails we still proceed since V1 doesn't run a Molmo server).
        $ISAAC_PY /tmp/predownload_models.py || { echo "[predownload] FATAL: SAM3 pre-warm failed"; exit 1; }
        echo "[predownload] HF_HOME size: $(du -sh $HF_HOME 2>/dev/null | cut -f1)"

        # ---------------------------------------------------------- #
        # Start perception servers in background tmux sessions.
        # SAM3 + Molmo weights are pre-cached under $HF_HOME above, so
        # the servers' hf_hub_download calls are no-op cache hits.
        # ---------------------------------------------------------- #
        mkdir -p /tmp/capx_servers
        export PYTHON_BIN="$ISAAC_PY"

        echo "[servers] launching SAM3 (8114), CGN (8115), PyRoKi (8116)"
        tmux new-session -d -s sam3 \
            "$ISAAC_PY -m capx.serving.launch_sam3_server --host 127.0.0.1 --port 8114 --device cuda > /tmp/capx_servers/sam3.log 2>&1; sleep infinity"
        tmux new-session -d -s cgn \
            "PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True $ISAAC_PY -m capx.serving.launch_contact_graspnet_server --host 127.0.0.1 --port 8115 --device cuda > /tmp/capx_servers/cgn.log 2>&1; sleep infinity"
        tmux new-session -d -s pyroki \
            "$ISAAC_PY -m capx.serving.launch_pyroki_server --port 8116 --host 127.0.0.1 --robot panda_description --target-link panda_hand > /tmp/capx_servers/pyroki.log 2>&1; sleep infinity"

        # Wait for SAM3 + CGN to bind ports (PyRoKi binds fast). Cap-x
        # itself also has _start_api_servers but we pre-start so the
        # YAML's api_servers block is a no-op (it skips already-bound
        # ports).
        for port in 8114 8115 8116; do
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/$port) >/dev/null 2>&1; then
              echo "[servers] :$port ready (after ${i}0s)"
              break
            fi
            sleep 10
          done
        done

        # ---------------------------------------------------------- #
        # Loop over scenes in the batch. All scenes share one RUN_TS
        # so a "batch" is identifiable as all dirs with that suffix.
        # Per-scene output dirs are isolated under capx-results/<scene>/
        # so cap-x's launcher (and the wrapper's `--clean`) don't trip
        # over each other.
        #
        # Scene list is keyed by batch_name. Tried passing scenes via
        # `--set-string scenes=...` first, but osmo's CLI eats both `,`
        # and `:` from the value (truncating to the first scene); this
        # case-stmt lookup keeps the YAML single-source-of-truth and
        # only requires osmo to ferry one token (batch_name).
        # ---------------------------------------------------------- #
        RUN_TS=$(date -u +%Y%m%dT%H%M%SZ)
        echo "[run] batch={{batch_name}} run_ts=$RUN_TS trials={{trials}}"

        # Wrapper timeout: cap-x's per-trial timeout is 1000s. With
        # `--trials N` running sequentially, the wrapper's wallclock cap
        # has to cover N × 1000s plus startup/shutdown overhead.
        WRAPPER_TIMEOUT_S=$(( {{trials}} * 1100 + 300 ))

        case "{{batch_name}}" in
          capx-cs-batch-0)
            SCENE_ARR=(InferClearTableTask InferConsolidateTask InferJoinGroupTask) ;;
          capx-cs-batch-1)
            SCENE_ARR=(InferMajorityGroupTask InferReturnStrayTask InferShelfFallenTask) ;;
          capx-cs-batch-2)
            SCENE_ARR=(InferTripleSortTask KitBalanceBinsTask KitCanFruitPairTask) ;;
          capx-cs-batch-3)
            SCENE_ARR=(KitEqualFruitsTask KitFruitUtensilTask KitLunchPairsTask) ;;
          capx-cs-batch-4)
            SCENE_ARR=(KitShelfRestockTask KitThreeBinsBlocksTask KitUtensilSetsTask) ;;
          capx-cs-batch-5)
            SCENE_ARR=(RecoverCanAmongFruitsTask RecoverFallenFruitTask RecoverFruitAmongCansTask) ;;
          capx-cs-batch-6)
            SCENE_ARR=(RecoverMisplacedTask RecoverNonFoodInBinTask RecoverSpillTask) ;;
          capx-cs-batch-7)
            SCENE_ARR=(RecoverToyInBowlTask RecoverWrongShelfTask SortCannedVeggiesAndFruitsTask) ;;
          capx-cs-batch-8)
            SCENE_ARR=(SortCondimentsVsCansTask SortFoodAndUtensilsTask SortFoodVsNonFoodTask) ;;
          capx-cs-batch-9)
            SCENE_ARR=(SortForksAndSpoonsTask SortFreshVsCannedTask SortProduceAndDairyTask) ;;
          smoke)
            SCENE_ARR=(InferClearTableTask) ;;
          *)
            echo "[run] FATAL: unknown batch_name '{{batch_name}}' — see osmo/run-capx-skill-library.yaml"
            exit 1 ;;
        esac
        echo "[run] scenes: ${SCENE_ARR[*]}"
        for scene in "${SCENE_ARR[@]}"; do
          # Trim possible whitespace.
          scene=$(echo "$scene" | xargs)
          RUN_OUTPUT_DIR=$LUSTRE_DIR/capx-results/$scene/$RUN_TS
          mkdir -p "$RUN_OUTPUT_DIR"
          echo
          echo "============================================================"
          echo "[run] scene=$scene  output_dir=$RUN_OUTPUT_DIR  wrap_timeout=${WRAPPER_TIMEOUT_S}s"
          echo "============================================================"

          cd "$CAPX_DIR"
          PYTHON="$ISAAC_PY" \
              ./scripts/run_capx_robolab_eval.sh \
                  --clean \
                  --config env_configs/robolab/franka_robolab_skill_library.yaml \
                  --scene-name "$scene" \
                  --trials {{trials}} \
                  --timeout $WRAPPER_TIMEOUT_S \
                  --output-dir "$RUN_OUTPUT_DIR" \
                  || echo "[run] wrapper exited non-zero for $scene (eval may have partial results)"

          echo "[done] $scene → $RUN_OUTPUT_DIR"
          ls -la "$RUN_OUTPUT_DIR" || true

          # Persist tmux server logs into each scene's run dir so
          # SAM3/CGN/PyRoKi failures are debuggable post-hoc from Lustre.
          if [ -d /tmp/capx_servers ]; then
            mkdir -p "$RUN_OUTPUT_DIR/_servers"
            cp -v /tmp/capx_servers/*.log "$RUN_OUTPUT_DIR/_servers/" 2>/dev/null || true
          fi
        done

        # Signal osmo we're done.
        touch /done.txt

        # Linger for a few minutes so a human can `osmo workflow ssh`
        # in if needed; remove if you'd rather the pod exit quickly.
        sleep 600
  resources:
    default:
      gpu: 1
      cpu: 12
      memory: 80Gi
      storage: 80Gi
      platform: ovx-l40

default-values:
  batch_name: smoke
  trials: 1
  user_name: siyic
