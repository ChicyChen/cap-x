# Robolab long-horizon task — privileged API baseline (v1: single trial).
#
# Drives a robolab Isaac-Sim long-horizon task end-to-end with CaP-Agent0
# code generation, using the privileged API tier (GT object poses + IK).
#
# Usage:
#   conda activate capx-robolab
#   cd /home/rescuedog/cap-x
#   python -m capx.envs.launch \
#     --config-path env_configs/robolab/franka_robolab_privileged.yaml \
#     --server-url https://inference-api.nvidia.com/v1/chat/completions \
#     --api-key "$NVIDIA_API_KEY" \
#     --model aws/anthropic/bedrock-claude-opus-4-7
#
# scene_name must match a gym-registered robolab scene id. See
# scripts/list_robolab_lh_scenes.py for the full list of 30 LH
# common-sense tasks.

env:
  _target_: capx.envs.tasks.franka.franka_libero_env.FrankaLiberoCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.robolab.FrankaRobolabTask
      scene_name: InferClearTableTask
      instruction_type: default
      max_steps: 4000
      device: cuda:0
      # Per-trial gt_state files land as ``trial_<NN>.jsonl`` here.
      # The wrapper script (scripts/run_capx_robolab_eval.sh) then
      # post-moves each into the matching cap-x trial dir.
      gt_state_dump_dir: ./outputs/franka_robolab_privileged/_pending_gt
      record_video: true
      video_subsample: 4
    privileged: true
    enable_render: false
    apis:
      - FrankaRobolabPrivilegedApi
    prompt: |
      You are controlling a Franka Emika robot via Python code execution.

      Goal: {libero_environment_goal}

      OUTPUT FORMAT (STRICT — your response will be parsed mechanically):
      Respond with exactly one Python code block wrapped in triple-backtick
      fences carrying the `python` language tag, like this:

      ```python
      # your code here
      ```

      - Do NOT write any natural-language explanation outside the code block.
        All reasoning belongs in `#` comments inside the code block.
      - Do NOT use plain ``` fences without the `python` tag — the parser
        only matches ```python.
      - The API functions documented below are already imported into the
        execution namespace. You only need explicit `import` statements
        for third-party libraries (e.g. `import numpy as np`).

      After your code executes, you will see the resulting observation and
      may emit additional code to continue the task if needed.

    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      If there were no errors during compilation or execution, the console
      stderr will be empty. If there were errors, consider regenerating the
      code.

      Please respond with EXACTLY ONE of the following:
      - The word `REGENERATE` followed immediately by new Python code in a
        fenced code block (```python ... ```) if you want to issue more
        actions to make further progress on the task.
      - The word `FINISH` if the task appears to be complete.

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
output_dir: ./outputs/franka_robolab_privileged

# Interaction mode: S1 (privileged) + M2 (text multi-turn) + M3 (visual
# feedback). M4 video differencing and ensemble are intentionally off.
use_visual_feedback: true
use_img_differencing: true
use_video_differencing: false
use_wrist_camera: false
use_parallel_ensemble: false
use_multimodel: false

# M3 needs a VLM to describe initial-scene + per-turn diffs. Re-use the
# same Claude Opus 4.7 endpoint as the code-gen model so we don't need
# a separate OpenRouter proxy on :8110. The code-gen model name has
# been added to VLM_MODELS in capx/llm/client.py so the visual paths
# actually fire.
visual_differencing_model: aws/anthropic/bedrock-claude-opus-4-7
visual_differencing_model_server_url: https://inference-api.nvidia.com/v1/chat/completions
# api_key supplied via wrapper's --visual-differencing-model-api-key flag.

trials: 1
num_workers: 1
